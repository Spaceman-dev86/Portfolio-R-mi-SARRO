<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte - Rémi Sarro | Développeur Web Freelance</title>
    <meta name="description" content="Carte de visite digitale de Rémi Sarro. Enregistrez rapidement mes coordonnées et découvrez mes services.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="carte.css">
    <link rel="icon" type="image/png" href="logo/web-designer.png">
</head>
<body>
    <header class="header" id="header">
        <nav class="nav container">
            <div class="logo">
                <img src="logo/web-designer.png" alt="Logo Rémi Sarro" class="logo-img">
            </div>
        </nav>
    </header>

    <main>
        <section class="carte-hero">
            <div class="container">
                <div class="carte-card">
                    <div class="carte-identity">
                        <div class="carte-avatar" aria-hidden="true">
                            <img src="logo/IMG_9953.jpg" alt="Photo de profil Rémi Sarro" class="carte-avatar-img">
                        </div>
                        <div class="carte-title">
                            <h1>Rémi Sarro</h1>
                            <p class="carte-role">Développeur web freelance</p>
                        </div>
                    </div>

                    <div class="carte-tags" aria-label="Spécialités">
                        <span class="carte-tag">Site web</span>
                        <span class="carte-tag">Site e-commerce</span>
                        <span class="carte-tag">Application</span>
                    </div>

                    <div class="carte-actions">
                        <a class="btn btn-primary carte-cta" href="remi-sarro.vcf">Ajouter aux contacts</a>
                        <a class="btn btn-outline carte-cta-secondary" href="index.html">Voir mon site</a>
                    </div>

                    <div class="carte-details">
                        <div class="carte-detail">
                            <div class="carte-detail-label">Téléphone</div>
                            <a class="carte-detail-value" href="tel:+33685139774">+33 6 85 13 97 74</a>
                        </div>
                        <div class="carte-detail">
                            <div class="carte-detail-label">Email</div>
                            <a class="carte-detail-value" href="mailto:remi.sarro@gmail.com">remi.sarro@gmail.com</a>
                        </div>
                        <div class="carte-detail">
                            <div class="carte-detail-label">LinkedIn</div>
                            <a class="carte-detail-value" href="https://www.linkedin.com/in/r%C3%A9mi-sarro-3b72231b8/" target="_blank" rel="noopener noreferrer">Voir mon profil</a>
                        </div>
                    </div>

                    <div class="carte-note">
                        <p>Scannez, enregistrez, et gardez mes informations pour me recontacter facilement.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
