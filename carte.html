<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte - Rémi Sarro | Développeur Web Freelance</title>
    <meta name="description" content="Carte de visite digitale de Rémi Sarro. Enregistrez rapidement mes coordonnées et découvrez mes services.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="carte.css">
    <link rel="icon" type="image/png" href="logo/web-designer.png">
</head>
<body>
    <header class="header" id="header">
        <nav class="nav container">
            <a href="index.html" class="logo">
                <img src="logo/web-designer.png" alt="Logo Rémi Sarro" class="logo-img">
            </a>

            <div class="lang-switcher" id="lang-switcher">
                <button class="lang-toggle" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span class="lang-code">FR</span>
                    <span class="lang-chevron" aria-hidden="true">▾</span>
                </button>
                <div class="lang-menu" role="listbox" aria-label="Choisir la langue">
                    <button class="lang-option" type="button" role="option" data-lang="fr" aria-selected="true">
                        <span class="lang-flag" aria-hidden="true">🇫🇷</span>
                        <span>Français</span>
                    </button>
                    <button class="lang-option" type="button" role="option" data-lang="en" aria-selected="false">
                        <span class="lang-flag" aria-hidden="true">🇬🇧</span>
                        <span>English</span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="carte-hero">
            <div class="container">
                <div class="carte-card">
                    <div class="carte-identity">
                        <div class="carte-avatar" aria-hidden="true">
                            <img src="logo/IMG_9953.jpg" alt="Photo de profil Rémi Sarro" class="carte-avatar-img">
                        </div>
                        <div class="carte-title">
                            <h1>Rémi Sarro</h1>
                            <p class="carte-role" data-i18n="card.role">Développeur web freelance</p>
                        </div>
                    </div>

                    <div class="carte-tags" aria-label="Spécialités">
                        <span class="carte-tag" data-i18n="card.tag.website">Site web</span>
                        <span class="carte-tag" data-i18n="card.tag.ecommerce">Site e-commerce</span>
                        <span class="carte-tag" data-i18n="card.tag.app">Application</span>
                    </div>

                    <div class="carte-actions">
                        <a class="btn btn-primary carte-cta" href="remi-sarro.vcf" data-i18n="card.addContact">Ajouter aux contacts</a>
                        <a class="btn btn-outline carte-cta-secondary" href="index.html" data-i18n="card.viewSite">Voir mon site</a>
                    </div>

                    <div class="carte-details">
                        <div class="carte-detail">
                            <div class="carte-detail-label" data-i18n="card.phone">Téléphone</div>
                            <a class="carte-detail-value" href="tel:+33685139774">+33 6 85 13 97 74</a>
                        </div>
                        <div class="carte-detail">
                            <div class="carte-detail-label" data-i18n="card.email">Email</div>
                            <a class="carte-detail-value" href="mailto:remi.sarro@gmail.com">remi.sarro@gmail.com</a>
                        </div>
                        <div class="carte-detail">
                            <div class="carte-detail-label" data-i18n="card.linkedin">LinkedIn</div>
                            <a class="carte-detail-value" href="https://www.linkedin.com/in/r%C3%A9mi-sarro-3b72231b8/" target="_blank" rel="noopener noreferrer" data-i18n="card.viewProfile">Voir mon profil</a>
                        </div>
                    </div>

                    <div class="carte-note">
                        <p data-i18n="card.note">Scannez, enregistrez, et gardez mes informations pour me recontacter facilement.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
